# git-cliff configuration.
#
# Used by the `release` job in .github/workflows/ci.yml to turn the Conventional
# Commits between two tags into that tag's GitHub Release notes. Preview it
# locally for the range since the last tag with:
#
#   git cliff --unreleased --tag vX.Y.Z
#
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
trim = true
# Groups are ordered by the number in the comment that starts their name,
# which the heading strips: features first, then fixes, and the rest after.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% if commit.breaking %} — **BREAKING CHANGE:** {{ commit.breaking_description }}{% endif %}\
{% endfor %}
{% endfor %}\
"""
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  # Security bumps are titled fix(deps); keep them with the other dependencies.
  { message = "^fix\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^test", group = "<!-- 4 -->Testing" },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = "^revert", group = "<!-- 7 -->Reverts" },
]
