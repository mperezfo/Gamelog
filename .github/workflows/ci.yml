name: CI

# Every push and pull request runs the checks. A push to main also publishes
# the `edge` image; a `vX.Y.Z` tag publishes that release (`X.Y.Z`, `X.Y`, `X`
# and `latest`) and creates its GitHub Release, with notes generated by
# git-cliff (see cliff.toml) from the Conventional Commits since the previous
# tag. Images only go out once the checks have passed.
#
# A pull request only runs the checks for the parts of the repository it
# touches (see `changes`); a skipped job counts as passing for the required
# status checks. Pushes to main and tags always run everything. Pushing again
# to a pull request cancels the run it supersedes.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only for pull requests: a run on main or a tag publishes images and must
  # not be cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a pull request touches. On a pull request the checkout is the
  # merge commit, so HEAD^1 is the tip of the base branch and the diff between
  # the two is exactly the pull request's changes. Anything else (a push, a
  # tag) runs every check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            files=all
          else
            files=$(git diff --name-only HEAD^1 HEAD)
          fi
          # The workflow file counts for every area: changing it can change
          # what any check does.
          check() {
            if [ "$files" = all ] || printf '%s\n' "$files" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check backend '^(backend/|\.github/workflows/)'
          check frontend '^(frontend/|\.github/workflows/)'
          check docs '^(README\.md|docs/|scripts/format-docs\.sh|\.prettierrc\.json|\.github/workflows/)'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      # The runner has Docker, so the integration tests start their own
      # MariaDB containers just as they do locally.
      - run: go test ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/format-docs.sh --check

  image:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Spelled out rather than derived from the repository name: image
          # names must be lowercase.
          images: ghcr.io/mperezfo/gamelog
          # `latest` follows releases only (the default for semver tags), never
          # main.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
      # The version reported by GET /api/health: the tag for a release, the
      # short commit hash for an edge build.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --notes-file "$CHANGELOG_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_PATH: ${{ steps.changelog.outputs.changelog }}
